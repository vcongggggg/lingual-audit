$kind: http-request
name: Save Vocabulary Review
url: "{{baseUrl}}/api/v1/content/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "vocabularyId": "{{testVocabularyId}}",
      "rating": "good",
      "quality": 4,
      "repetitions": 1,
      "intervalDays": 1,
      "easeFactor": 2.5,
      "nextDueAt": "{{$isoTimestamp}}",
      "timeSpentMs": 4200,
      "idempotencyKey": "review-{{$guid}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Review saved and XP returned", function () {
          pm.response.to.have.status(200);
          const body = pm.response.json();
          pm.expect(body.saved).to.eql(true);
          pm.expect(body).to.have.property("xp");
      });
